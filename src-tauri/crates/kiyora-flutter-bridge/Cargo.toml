[package]
name = "kiyora-flutter-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
vault-core.workspace = true
vault-sync.workspace = true
vault-domain.workspace = true
vault-db.workspace = true
vault-snapshot.workspace = true
vault-media.workspace = true
vault-telegram.workspace = true
zeroize = "1"
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
kiyora-desktop-media = { path = "../kiyora-desktop-media" }

[target.'cfg(target_os = "android")'.dependencies]
kiyora-android-runtime = { path = "../kiyora-android-runtime" }
jni = "=0.21.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile.workspace = true
vault-security.workspace = true
